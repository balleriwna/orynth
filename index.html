    body {

      background-image: 
        linear-gradient(to right, rgba(144, 200, 239, 0.18) 1px, transparent 1px),

      background-size: 24px 24px;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #FAF9F5; }
    ::-webkit-scrollbar-thumb { background: #BAE0F5; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #90C8EF; }

    .washi-tape-blue {
      background: rgba(186, 224, 245, 0.85);
      border-left: 3px dashed rgba(144, 200, 239, 0.6);

    .stpageflip-container {

      border-radius: 16px;
      overflow: hidden;
      margin: 0 auto;
      border: 4px solid #ffffff;
      background: #ffffff;
    }
    .page-sheet {
      background-color: #FFFDF9;
      border: 1px solid #E2EEF9;
      padding: 24px;
      overflow-y: auto;
      position: relative;
    }
    .page-sheet::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 18px;
      background: linear-gradient(to right, rgba(15, 23, 42, 0.08), transparent);
      pointer-events: none;
      z-index: 10;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spinSlow 12s linear infinite;
    }

    @keyframes floatSticker {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }
    .animate-float-1 { animation: floatSticker 4s ease-in-out infinite; }
    .animate-float-2 { animation: floatSticker 5s ease-in-out infinite 1.5s; }
    .animate-float-3 { animation: floatSticker 4.5s ease-in-out infinite 0.8s; }
  </style>

            minWidth: 280,
            maxWidth: 420,
            minHeight: 400,
            maxHeight: 580,

            mobileScrollSupport: true,

              <div className="page-sheet flex flex-col items-center justify-center text-center space-y-4">

    function OpenWhenLettersSection() {
      const [selectedLetter, setSelectedLetter] = useState(null);

          <div className="mb-8">

            {lettersData.map((letter) => (
              <button
                key={letter.id}
                onClick={() => setSelectedLetter(letter)}
                className="bg-white hover:bg-pastel-blue/40 p-4 rounded-2xl border-2 border-pastel-powder/40 shadow-soft flex flex-col items-center gap-2 text-center transition-all duration-300 hover:-translate-y-1.5 group relative overflow-hidden"
              >
                <div className="w-10 h-10 bg-pastel-blue rounded-full flex items-center justify-center text-lg group-hover:scale-110 transition-transform">

          {selectedLetter && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full border-2 border-pastel-powder shadow-2xl text-left relative">
                <button onClick={() => setSelectedLetter(null)} className="absolute top-4 right-4 text-pastel-navy/50 hover:text-pastel-navy text-lg font-bold">✕</button>
                <span className="text-xs font-semibold uppercase tracking-wider text-pastel-powder font-mono">Envelope #{selectedLetter.id.toUpperCase()}</span>
                <h3 className="font-serif text-xl font-bold text-pastel-navy my-2 border-b border-pastel-powder/30 pb-2">{selectedLetter.title}</h3>
                <div className="bg-pastel-blue/20 p-5 rounded-2xl border border-pastel-powder/30 text-sm text-pastel-navy/80 leading-relaxed font-sans">
                  {selectedLetter.content}
                </div>
                <div className="mt-6 text-right">
                  <button onClick={() => setSelectedLetter(null)} className="bg-pastel-powder hover:bg-pastel-baby text-pastel-navy text-xs font-bold px-6 py-2.5 rounded-full shadow-sm">
                    Close Letter
                  </button>
                </div>
              </div>
            </div>
          )}

      );
    }

    function MediaSection() {
      const [currentSong, setCurrentSong] = useState(musicList[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
        } else {
          audioRef.current.play().catch(() => {});
        }
        setIsPlaying(!isPlaying);
      };

      return (
        <section id="media" className="max-w-5xl mx-auto px-4 py-16">
          <div className="text-center mb-10">
            <span className="bg-pastel-blue/60 text-pastel-navy px-4 py-1.5 rounded-full border border-pastel-powder/40 text-xs font-semibold">🎵 Media Lounge</span>
            <h2 className="font-serif text-3xl md:text-4xl font-bold text-pastel-navy mt-2">Music & Videos</h2>
          </div>

          <div className="bg-white/90 p-6 rounded-3xl border-2 border-pastel-powder/40 shadow-soft max-w-xl mx-auto mb-12 relative overflow-hidden">
            <div className="washi-tape-blue absolute -top-3 left-1/2 -translate-x-1/2 w-28 h-6 rounded-sm"></div>
            <audio ref={audioRef} src={currentSong.src} onEnded={() => setIsPlaying(false)} />
            <div className="flex flex-col sm:flex-row items-center gap-5 mt-2">
              <div className="relative">
                <img src={currentSong.cover} className={`w-24 h-24 rounded-full object-cover shadow-md border-2 border-white ${isPlaying ? 'animate-spin-slow' : ''}`} />
                <div className="w-6 h-6 bg-white rounded-full absolute inset-0 m-auto border-2 border-pastel-powder"></div>
              </div>

              <div className="flex-1 text-center sm:text-left">
                <h4 className="font-serif text-base font-bold text-pastel-navy">{currentSong.title}</h4>
                <p className="text-xs text-pastel-navy/60 font-mono">{currentSong.artist}</p>
                <div className="flex items-center justify-center sm:justify-start gap-3 mt-3">
                  <button onClick={togglePlay} className="bg-pastel-powder hover:bg-pastel-baby px-5 py-2 rounded-full text-xs font-bold text-pastel-navy shadow-sm transition-all">
                    {isPlaying ? 'Pause ⏸' : 'Play ▶'}
                  </button>
                  <select 
                    onChange={(e) => {
                      const song = musicList.find(s => s.id === parseInt(e.target.value));
                      if (song) {
                        setCurrentSong(song);
                        setIsPlaying(false);
                      }
                    }}
                    className="text-xs border border-pastel-powder/50 rounded-xl px-3 py-1.5 bg-white text-pastel-navy font-medium shadow-sm outline-none"
                  >
                    {musicList.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            {videoList.map((video) => (
              <div key={video.id} className="bg-white/95 p-3 rounded-3xl border-2 border-pastel-powder/40 shadow-soft overflow-hidden">
                <div className="aspect-video rounded-2xl overflow-hidden bg-slate-900">
                  <video src={video.src} poster={video.thumbnail} controls className="w-full h-full object-contain" />
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

      return (

              <span className="bg-pastel-blue/80 text-pastel-navy px-4 py-1.5 rounded-full border border-pastel-powder/50 text-xs font-bold mb-3 shadow-sm">

              <h1 className="font-serif text-4xl md:text-6xl font-bold text-pastel-navy tracking-tight leading-tight">

              <p className="text-sm md:text-base text-pastel-navy/70 max-w-lg mx-auto mt-3 font-sans">

              <div className="max-w-xs mx-auto my-8 p-3 bg-white rounded-3xl shadow-polaroid border-2 border-pastel-powder/40 rotate-1 hover:rotate-0 transition-transform duration-300 relative">
                <div className="washi-tape-blue absolute -top-3 left-1/2 -translate-x-1/2 w-24 h-6 rounded-sm"></div>

            <ProfileHeader />

          <footer className="mt-20 py-10 bg-white/90 border-t-2 border-pastel-powder/30 text-center relative">
            <div className="max-w-md mx-auto px-4 flex flex-col items-center gap-2.5">
              <div className="w-12 h-12 rounded-2xl overflow-hidden border-2 border-pastel-powder shadow-sm">

              </div>
              <p className="font-serif text-sm font-semibold text-pastel-navy">dari <span className="text-pastel-powder font-bold">@carmencakep</span></p>
              <p className="text-xs text-pastel-navy/60">Made with 🩵 just for you.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
