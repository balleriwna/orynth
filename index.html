    // KOMPONEN FOTO DENAN PLACEHOLDER
    function ImageWithFallback({ src, alt, className = "" }) {
      const [error, setError] = useState(false);
      if (error || !src) {
        return (
          <div className={`bg-pastel-blue/40 border-2 border-dashed border-pastel-powder rounded-2xl flex flex-col items-center justify-center p-6 text-center text-pastel-navy/70 ${className}`}>

            <span className="text-[10px] font-mono mt-1 text-pastel-navy/60 bg-white/60 px-2 py-0.5 rounded border border-pastel-powder/30">
              {src ? src.split('/').pop() : 'assets/images/...'}
            </span>
          </div>
        );
      }
      return <img src={src} alt={alt} onError={() => setError(true)} className={`object-contain max-w-full h-auto ${className}`} loading="lazy" />;
    }

    // GRADUATION FLIPBOOK (DENGAN STPAGEFLIP MEMBALIK HALAMAN BUKU FISIK)
    function GraduationFlipbookSection() {
      const bookContainerRef = useRef(null);
      const pageFlipRef = useRef(null);

      useEffect(() => {
        if (bookContainerRef.current && window.St && window.St.PageFlip) {
          const isMobile = window.innerWidth < 768;
          const pageFlip = new window.St.PageFlip(bookContainerRef.current, {
            width: isMobile ? 320 : 380,
            height: isMobile ? 460 : 520,
            size: "fixed",
            minWidth: 280,
            maxWidth: 420,
            minHeight: 400,
            maxHeight: 580,
            showCover: true,
            mobileScrollSupport: true,
            usePortrait: isMobile
          });

          pageFlip.loadFromHTML(document.querySelectorAll(".page-sheet"));
          pageFlipRef.current = pageFlip;
        }
      }, []);

      const flipPrev = () => pageFlipRef.current && pageFlipRef.current.flipPrev();
      const flipNext = () => pageFlipRef.current && pageFlipRef.current.flipNext();

      return (
        <section id="graduation" className="max-w-5xl mx-auto px-4 py-16 text-center">
          <div className="mb-8">
            <span className="bg-pastel-blue/60 text-pastel-navy px-4 py-1.5 rounded-full border border-pastel-powder/40 text-xs font-semibold">📖 Graduation Flipbook</span>
            <h2 className="font-serif text-3xl md:text-4xl font-bold text-pastel-navy mt-2">Graduation Memory Book</h2>
            <p className="text-xs text-pastel-navy/60 mt-1">Buka dan geser lembaran buku untuk membaca pesan graduation!</p>
          </div>

          <div className="flex justify-center items-center my-6">
            <div ref={bookContainerRef} className="stpageflip-container">
              {/* PAGE 1: COVER */}
              <div className="page-sheet flex flex-col items-center justify-center text-center space-y-4">
                <div className="w-full h-64 rounded-2xl overflow-hidden bg-pastel-blue/30 p-2 border border-pastel-powder/20">
                  <ImageWithFallback src={images.flipbookOpening} alt="Opening" className="w-full h-full object-contain" />
                </div>
                <h3 className="font-serif text-xl font-bold text-pastel-navy">A little celebration of your hard work.</h3>
                <p className="text-xs text-pastel-navy/60 font-mono">← Swipe/Drag to Flip →</p>
              </div>

              {/* PAGE 2: GRADUATION PHOTO */}
              <div className="page-sheet flex flex-col items-center justify-center">
                <div className="w-full h-full rounded-2xl overflow-hidden bg-pastel-blue/20 p-2 border border-pastel-powder/20 flex items-center justify-center">
                  <ImageWithFallback src={images.graduation} alt="Graduation Photo" className="w-full h-full object-contain" />
                </div>
              </div>

              {/* PAGE 3: GRADUATION MESSAGE */}
              <div className="page-sheet text-left space-y-3">
                <h4 className="font-serif text-lg font-bold text-pastel-navy border-b border-pastel-powder/20 pb-2">Graduation Message 🎓</h4>
                <p className="text-xs text-pastel-navy/80 leading-relaxed font-sans whitespace-pre-line">
                  {`Happy graduation, Kalan! You finally did it! Seeing you reach this incredible milestone and officially earn your degree makes me so ridiculously proud of you. You put in the time, the focus, and the effort, and now you are standing on the other side of all that hard work with a degree that proves just how capable you are.

I know how many exhausting nights, stressful deadlines, and quiet sacrifices went into making this day happen. All those moments where you felt tired, overwhelmed, or wondered if it would ever end were not in vain. You fought through every obstacle, and you earned every single bit of this success through your own grit and determination.

As you step out into the world with your degree, I have absolutely no doubt that you are going to accomplish amazing things. Whatever path you choose next, whether it is continuing your studies, building your career, or pursuing new passions, I know you will approach it with the same brilliance and dedication you showed throughout college.

Honestly, watching your journey from afar over these past two years has been such an honor and a privilege. Seeing all your hard work pay off and watching you cross the finish line with your degree in hand genuinely brings tears to my eyes and warms my heart beyond words. Never forget how much strength and potential you carry within yourself, Kalan. I will always be in your corner, cheering for you through every single victory to come.`}
                </p>
              </div>

              {/* PAGE 4: FRIENDSHIP PHOTO */}
              <div className="page-sheet flex flex-col items-center justify-center">
                <div className="w-full h-full rounded-2xl overflow-hidden bg-pastel-blue/20 p-2 border border-pastel-powder/20 flex items-center justify-center">
                  <ImageWithFallback src={images.friendship} alt="Friendship Photo" className="w-full h-full object-contain" />
                </div>
              </div>

              {/* PAGE 5: FRIENDSHIP MESSAGE */}
              <div className="page-sheet text-left space-y-3">
                <h4 className="font-serif text-lg font-bold text-pastel-navy border-b border-pastel-powder/20 pb-2">A Note on Friendship 🩵</h4>
                <p className="text-xs text-pastel-navy/80 leading-relaxed font-sans whitespace-pre-line">
                  {`Halooooo Kalan, makasih ya udah mau jadi temen gue kurang lebih 2 tahun ini. Honest speaking, gue gatau apakah lu bakal mengingat gue seperti gue mengingat lu atau enggaa, tapi satu hal yang pasti, gue sangat amat bersyukur karena bisa kenalan dan berteman sama lu. (Beneran ga boong)

Gue sadar kita mungkin ga bisa selamanya berteman atau ngobrol tiap hari. Tapi walaupun pertemanan kita ini tergolong low maintenance, sosok lu tuh beneran berkesan banget buat gue🥺✌🏻. Tipe pertemanan yang biarpun kita jarang main atau jarang kontek-kontekan, tempat lu di ingatan gue bakal tetep hangat dan bener-bener ga bisa gue lupain gitu ajaaa.

Makasih banyak ya udah mau temenan sama gue. Makasih udah dengerin cerita-cerita gue, udah mau main bareng, dan udah ekstra sabar menghadapi gue selama ini... Intinya makasih banyak yaaa. Having you as a friend over these past two years has been such a sweet blessing for me. Thank you for always being a safe space, for existing, and for being such a memorable part of my life, Kalan!`}
                </p>
              </div>

              {/* PAGE 6: CLOSING */}
              <div className="page-sheet flex flex-col items-center justify-center text-center space-y-4">
                <div className="w-full h-56 rounded-2xl overflow-hidden bg-pastel-blue/30 p-2 border border-pastel-powder/20">

                <p className="text-xs text-pastel-navy/70">Your journey is just beginning. Keep growing, keep dreaming, and keep being you.</p>
              </div>
            </div>
          </div>

          <div className="flex justify-center gap-4 mt-4">
            <button onClick={flipPrev} className="bg-white hover:bg-pastel-blue text-pastel-navy font-bold px-6 py-2 rounded-full border border-pastel-powder/40 shadow-sm text-xs">
              ← Prev Page
            </button>
            <button onClick={flipNext} className="bg-white hover:bg-pastel-blue text-pastel-navy font-bold px-6 py-2 rounded-full border border-pastel-powder/40 shadow-sm text-xs">
              Next Page →
            </button>
          </div>
        </section>
      );
    }

                key={letter.id}
                onClick={() => setSelectedLetter(letter)}
                className="bg-white hover:bg-pastel-blue/40 p-4 rounded-2xl border-2 border-pastel-powder/40 shadow-soft flex flex-col items-center gap-2 text-center transition-all duration-300 hover:-translate-y-1"
              >
                <div className="w-10 h-10 bg-pastel-blue rounded-full flex items-center justify-center text-lg">✉️</div>
                <span className="font-serif text-xs font-bold text-pastel-navy line-clamp-2">{letter.title}</span>
              </button>
            ))}
          </div>

          {selectedLetter && (
            <div className="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full border-2 border-pastel-powder shadow-2xl text-left relative">
                <button onClick={() => setSelectedLetter(null)} className="absolute top-4 right-4 text-gray-400 hover:text-black">✕</button>
                <span className="text-xs font-semibold uppercase text-pastel-powder">Envelope #{selectedLetter.id.toUpperCase()}</span>
                <h3 className="font-serif text-xl font-bold text-pastel-navy my-2 border-b border-pastel-powder/30 pb-2">{selectedLetter.title}</h3>
                <div className="bg-pastel-blue/20 p-4 rounded-2xl border border-pastel-powder/30 text-sm text-pastel-navy/80 leading-relaxed font-sans">
                  {selectedLetter.content}
                </div>
                <div className="mt-6 text-right">
                  <button onClick={() => setSelectedLetter(null)} className="bg-pastel-powder hover:bg-pastel-baby text-pastel-navy text-xs font-bold px-6 py-2 rounded-full">
                    Close Letter
                  </button>
                </div>
              </div>
            </div>
          )}
        </section>
      );
    }

    // MEDIA SECTION (3 MUSIK + 2 VIDEO)
    function MediaSection() {
      const [currentSong, setCurrentSong] = useState(musicList[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const audioRef = useRef(null);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
        } else {
          audioRef.current.play().catch(() => {});
        }
        setIsPlaying(!isPlaying);
      };

      return (
        <section id="media" className="max-w-5xl mx-auto px-4 py-16">
          <div className="text-center mb-10">
            <span className="bg-pastel-blue/60 text-pastel-navy px-4 py-1.5 rounded-full border border-pastel-powder/40 text-xs font-semibold">🎵 Media Lounge</span>
            <h2 className="font-serif text-3xl md:text-4xl font-bold text-pastel-navy mt-2">Music & Videos</h2>
          </div>

          {/* Pemutar Musik */}
          <div className="bg-white/90 p-6 rounded-3xl border-2 border-pastel-powder/40 shadow-soft max-w-xl mx-auto mb-10">
            <audio ref={audioRef} src={currentSong.src} onEnded={() => setIsPlaying(false)} />
            <div className="flex flex-col sm:flex-row items-center gap-4">
              <img src={currentSong.cover} className="w-20 h-20 rounded-2xl object-cover" />
              <div className="flex-1 text-center sm:text-left">
                <h4 className="font-serif text-base font-bold text-pastel-navy">{currentSong.title}</h4>
                <p className="text-xs text-pastel-navy/60">{currentSong.artist}</p>
                <div className="flex items-center justify-center sm:justify-start gap-3 mt-3">
                  <button onClick={togglePlay} className="bg-pastel-powder hover:bg-pastel-baby px-5 py-1.5 rounded-full text-xs font-bold text-pastel-navy">
                    {isPlaying ? 'Pause ⏸' : 'Play ▶'}
                  </button>
                  <select 
                    onChange={(e) => {
                      const song = musicList.find(s => s.id === parseInt(e.target.value));
                      if (song) {
                        setCurrentSong(song);
                        setIsPlaying(false);
                      }
                    }}
                    className="text-xs border border-pastel-powder/50 rounded-lg px-2 py-1 bg-white text-pastel-navy"
                  >
                    {musicList.map(s => <option key={s.id} value={s.id}>{s.title}</option>)}
                  </select>
                </div>
              </div>
            </div>
          </div>

          {/* Galeri Video */}
          <div className="grid md:grid-cols-2 gap-6">
            {videoList.map((video) => (
              <div key={video.id} className="bg-white/90 p-4 rounded-3xl border-2 border-pastel-powder/40 shadow-soft">
                <div className="aspect-video rounded-2xl overflow-hidden bg-slate-900 mb-3">
                  <video src={video.src} poster={video.thumbnail} controls className="w-full h-full object-contain" />
                </div>
                <h4 className="font-serif text-base font-bold text-pastel-navy">{video.title}</h4>
                <p className="text-xs text-pastel-navy/70 mt-1">{video.description}</p>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // MAIN APP
    function App() {
      return (
        <div className="min-h-screen flex flex-col font-sans">
          <Navbar />
          <main className="flex-1">
            <section id="home" className="min-h-[75vh] flex flex-col items-center justify-center text-center px-4 py-12">
              <span className="bg-pastel-blue/60 text-pastel-navy px-4 py-1.5 rounded-full border border-pastel-powder/40 text-xs font-semibold mb-3">Hi, Kalan! ✨</span>
              <h1 className="font-serif text-4xl md:text-6xl font-bold text-pastel-navy">A Little World Made Just For You</h1>
              <p className="text-sm md:text-base text-pastel-navy/70 max-w-lg mx-auto mt-3">A digital memory scrapbook celebrating your birthday and graduation journey.</p>
              <div className="max-w-xs mx-auto my-6 p-3 bg-white rounded-3xl shadow-soft border-2 border-pastel-powder/40">
                <ImageWithFallback src={images.homepage} alt="Kalan Main" className="w-full h-auto rounded-2xl object-cover" />
              </div>
              <a href="#birthday" className="bg-pastel-powder hover:bg-pastel-baby text-pastel-navy font-bold text-sm px-8 py-3.5 rounded-full shadow-md">
                Explore Your Surprise ✨
              </a>
            </section>

            <ProfileHeader />
            <BirthdayGiftSection />
            <GraduationFlipbookSection />
            <MediaSection />
            <OpenWhenLettersSection />
          </main>

          <footer className="mt-20 py-10 bg-white/80 border-t border-pastel-powder/30 text-center">
            <div className="max-w-md mx-auto px-4 flex flex-col items-center gap-2">
              <div className="w-12 h-12 rounded-full overflow-hidden border-2 border-pastel-powder">
                <ImageWithFallback src={images.footer} alt="Carmen" className="w-full h-full object-cover" />
              </div>
              <p className="font-serif text-sm font-semibold text-pastel-navy">dari <span className="text-pastel-powder">@carmencakep</span></p>
              <p className="text-xs text-pastel-navy/60">Made with 🩵 just for you.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
